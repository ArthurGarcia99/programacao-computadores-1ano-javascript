<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Boas Vindas!</h1>
        <p>Vamos Personalizar sua saudação usando JavaScript</p>
        <div class="saudacao" id="mensagemsaudacao">Olá, visitante!</div>
        <button onclick="mudarNome()">Personalizar saudação</button>
    </div>

    <script>
        function mudarNome(){
            document.getElementById("mensagemsaudacao").textContent = "Olá, Arthur!"
        }
    </script>
</body>
</html>
