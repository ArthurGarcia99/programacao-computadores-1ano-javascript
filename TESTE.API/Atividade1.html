<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo de Consumo de API</title>
</head>
<body>
  <h1>Lista de Usuários</h1>
  <button onclick="carregarUsuarios()">Consultar endereço</button>
  <ul id="listaUsuarios"></ul>

  <script>
    // livra de fazer outra atividade quem chamou esta funcao
    async function carregarUsuarios() {
      try {
        // await -> aguarda resposta da API
        const resposta = await fetch("https://jsonplaceholder.typicode.com/users");
        const usuarios = await resposta.json();
        const lista = document.getElementById("listaUsuarios");
        lista.innerHTML = ""; // limpa lista

        for (let i = 0; i < usuarios.length; i++) {
          const li = document.createElement("li");
          li.textContent = `${usuarios[i].name} - ${usuarios[i].address.street} - ${usuarios[i].address.city} - ${usuarios[i].address.zipcode}`;
          lista.appendChild(li);
        }
      } catch (erro) {
        console.error("Erro ao carregar usuários:", erro);
        alert("Não foi possível carregar os dados da API.");
      }
    }
  </script>
</body>
</html>
