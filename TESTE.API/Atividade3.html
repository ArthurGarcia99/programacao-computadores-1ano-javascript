<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo de Consumo de API</title>
</head>
<body>
  <h1>Visualizador de Postagens</h1>
  <div class="controle">
    <input type="number" id="quantidade" placeholder="10" min="1" max="10">
    <button onclick="carregarPostagens()">Carregar Postagens</button>
  </div>
  <div id="galeria"></div>

  <script>
    async function carregarPostagens() {
      const quantidade = document.getElementById('quantidade').value;
      const url = `https://jsonplaceholder.typicode.com/posts?_limit=${quantidade}`;
      const galeria = document.getElementById('galeria');

      galeria.innerHTML = "<p>Carregando postagens...</p>";

      try {
        const resposta = await fetch(url);
        const postagens = await resposta.json();

        galeria.innerHTML = "";

        for (let i = 0; i < postagens.length; i++) {
          const div = document.createElement('div');
          div.innerHTML = `
            <p><strong>${postagens[i].title}</strong></p>
            <p><strong>${postagens[i].body}</strong></p>
            <p><strong>--------------------------</strong></p>`;
          galeria.appendChild(div);
        }
      } catch (erro) {
        console.error("Erro ao carregar postagens:", erro);
        alert("Não foi possível carregar os dados da API.");
      }
    }
  </script>
</body>
</html>
