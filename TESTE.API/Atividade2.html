<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo de Consumo de API</title>
</head>
<body>
  <h1>Galeria de Fotos</h1>
  <div class="controle">
    <input type="number" id="quantidade" placeholder="10" min="1" max="10">
    <button onclick="carregarGaleria()">Carregar Galeria</button>
  </div>
  <div id="galeria"></div>

  <script>
    async function carregarGaleria() {
      const quantidade = document.getElementById('quantidade').value || 10;
      const url = `https://jsonplaceholder.typicode.com/photos?_limit=${quantidade}`;
      const galeria = document.getElementById('galeria');

      galeria.innerHTML = "<p>Carregando fotos...</p>";

      try {
        const resposta = await fetch(url);
        const fotos = await resposta.json();

        galeria.innerHTML = "";

        for (let i = 0; i < fotos.length; i++) {
          const div = document.createElement('div');
          div.innerHTML = `
            <p><strong>${fotos[i].title}</strong></p>
            <img src="${fotos[i].thumbnailUrl}" alt="${fotos[i].title}">
          `;
          galeria.appendChild(div);
        }
      } catch (erro) {
        console.error("Erro ao carregar fotos:", erro);
        alert("Não foi possível carregar os dados da API.");
      }
    }
  </script>
</body>
</html>
